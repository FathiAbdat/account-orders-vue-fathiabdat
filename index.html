<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yum Ta Dum Account & Orders microfrontend." />
    <meta name="theme-color" content="#2E7D32" />
    <link rel="icon" type="image/png" href="/brand/yumy.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>Yum Ta Dum | Account &amp; Orders</title>
    <style>
      * { box-sizing: border-box; }
      html { background: #f9f8f3; }
      body { margin: 0; color: #1f1f1f; background: #f9f8f3; font-family: Roboto, Arial, sans-serif; }
      button, a { font: inherit; }
      .app-shell { display: flex; min-height: 100vh; flex-direction: column; }
      .app-header { position: sticky; top: 0; z-index: 10; display: flex; width: 100%; min-height: 82px; align-items: center; justify-content: flex-start; gap: 58px; margin: 0; padding: 10px 40px; background: rgba(255,253,251,.98); border-bottom: 1px solid #ece8e2; box-shadow: 0 1px 8px rgba(31,31,31,.035); backdrop-filter: blur(14px); }
      .brand { display: flex; align-items: center; gap: 8px; color: #23762c; font-size: 22px; font-weight: 900; letter-spacing: -.035em; white-space: nowrap; }
      .brand-mascot { position: relative; display: block; width: 54px; height: 54px; overflow: hidden; flex: 0 0 auto; }
      .brand-mascot img { position: absolute; top: -3px; left: -34px; width: 116px; max-width: none; height: auto; }
      .app-nav { display: flex; align-items: center; gap: 20px; }
      .app-nav a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 8px; border-radius: 10px; color: #1f1f1f; text-decoration: none; font-size: 16px; font-weight: 800; }
      .app-nav a:hover { color: #23762c; }
      .app-nav a:focus-visible { color: #185e20; outline: none; box-shadow: 0 0 0 3px rgba(245,124,0,.3); }
      main { width: 100%; flex: 1 0 auto; margin: 0; padding: 0; }
      yum-account-orders { display: block; width: 100%; min-height: calc(100vh - 342px); }
      .app-footer { width: 100%; margin: 0; padding: 48px 20px 50px; color: #cfe2d1; background: #155f20; font-size: 16px; }
      .footer-top { display: flex; min-height: 64px; align-items: center; justify-content: space-between; gap: 32px; }
      .footer-brand { display: inline-flex; align-items: center; gap: 10px; color: #fff; font-size: 21px; font-weight: 900; letter-spacing: -.03em; white-space: nowrap; }
      .footer-brand-mascot { position: relative; display: block; width: 64px; height: 64px; overflow: hidden; flex: 0 0 auto; }
      .footer-brand-mascot img { position: absolute; top: -4px; left: -40px; width: 138px; max-width: none; height: auto; }
      .footer-message { margin: 0; color: #d8e8da; font-weight: 500; }
      .footer-divider { width: 100%; height: 1px; margin: 34px 0 32px; background: rgba(255,255,255,.16); }
      .footer-bottom { margin: 0; color: #c4d9c7; }
      .app-toast { position: fixed; right: 20px; bottom: 20px; z-index: 20; max-width: 360px; padding: 14px 18px; border-radius: 14px; color: white; background: #1f1f1f; box-shadow: 0 12px 32px rgba(0,0,0,.2); opacity: 0; transform: translateY(12px); pointer-events: none; transition: .2s ease; }
      .app-toast[data-visible="true"] { opacity: 1; transform: translateY(0); }
      @media (max-width: 720px) {
        .app-header { align-items: flex-start; flex-direction: column; gap: 6px; padding: 10px 16px 12px; }
        .app-nav { width: 100%; gap: 18px; overflow-x: auto; }
        .app-nav a { padding: 0 4px; }
        yum-account-orders { min-height: 0; }
        .app-footer { padding: 36px 16px 40px; }
        .footer-top { align-items: flex-start; flex-direction: column; gap: 18px; }
        .footer-message { line-height: 1.5; }
        .footer-divider { margin: 28px 0 26px; }
        .footer-bottom { line-height: 1.5; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand" aria-label="Yum Ta Dum">
          <span class="brand-mascot" aria-hidden="true"><img src="/brand/yumy.png" alt="" /></span>
          <span>Yum Ta Dum</span>
        </div>
        <nav class="app-nav" aria-label="Account navigation">
          <a href="/orders">Orders</a>
          <a href="/profile">Profile</a>
          <a href="/login">Login</a>
          <a href="/register">Register</a>
        </nav>
      </header>
      <main>
        <yum-account-orders route="/orders" standalone></yum-account-orders>
      </main>
     
      <div class="app-toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/standalone.ts"></script>
  </body>
</html>
